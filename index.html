<script>
const storageButtons = document.querySelectorAll(".choice");
const colorButtons = document.querySelectorAll(".color");

const selectedStorage = document.getElementById("selectedStorage");
const selectedColor = document.getElementById("selectedColor");
const selectedPrice = document.getElementById("selectedPrice");

const storageInput = document.getElementById("storageInput");
const colorInput = document.getElementById("colorInput");
const priceInput = document.getElementById("priceInput");

storageButtons.forEach(button => {
  button.addEventListener("click", () => {

    storageButtons.forEach(b => b.classList.remove("active"));
    button.classList.add("active");

    const storage = button.dataset.storage;
    const price = button.dataset.price;

    selectedStorage.textContent = storage;
    selectedPrice.textContent = "$" + price;

    storageInput.value = storage;
    priceInput.value = "$" + price;
  });
});

colorButtons.forEach(button => {
  button.addEventListener("click", () => {

    colorButtons.forEach(b => b.classList.remove("active"));
    button.classList.add("active");

    const color = button.dataset.color;

    selectedColor.textContent = color;
    colorInput.value = color;
  });
});
</script>
